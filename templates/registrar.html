<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - Netflix Clone</title>
    <style>
        body { 
            background-color: #141414; 
            color: white; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        .container { 
            background-color: rgba(0,0,0,0.75); 
            padding: 60px; 
            border-radius: 4px; 
            width: 300px;
        }
        h2 { margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 4px; 
            border: none; 
            background: #333; 
            color: white;
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #E50914; 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background-color: #b20710; }
        .flash { color: #E50914; font-size: 0.9rem; margin-bottom: 10px; }
        a { color: #fff; text-decoration: none; font-size: 0.8rem; display: block; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cadastrar</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <p class="flash">{{ message }}</p>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Escolha um usuário" required>
            <input type="password" name="password" placeholder="Escolha uma senha" required>
            <button type="submit">Cadastrar</button>
        </form>

        <a href="/login">Já tem uma conta? Faça login aqui.</a>
    </div>

</body>
</html>
