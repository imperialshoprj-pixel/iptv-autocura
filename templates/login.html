<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Cloneflix</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(0,0,0,0.85); padding: 60px; border-radius: 4px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #333; border: none; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 15px; background: #E50914; border: none; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 4px; }
        .btn-cad { width: 100%; padding: 15px; background: transparent; border: 1px solid #fff; color: white; margin-top: 10px; cursor: pointer; border-radius: 4px; }
        .flash { color: #E50914; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Entrar</h1>
        {% with messages = get_flashed_messages() %}{% if messages %}<p class="flash">{{ messages[0] }}</p>{% endif %}{% endwith %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <p style="text-align: center; margin: 20px 0;">ou</p>
        <button class="btn-cad" onclick="window.location.href='/registrar'">Cadastrar Conta</button>
    </div>
</body>
</html>
