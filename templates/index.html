<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Catálogo Netflix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #141414; color: white; }
        .card { background: #2f2f2f; border: none; transition: transform 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card-img-top { height: 300px; object-fit: cover; }
        .card-title { font-size: 1rem; padding: 10px; color: #fff; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">Catálogo</h1>
        <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-4">
            {% for id, item in catalogo.items() %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ item.capa }}" class="card-img-top" alt="{{ item.titulo }}">
                    <div class="card-body p-0">
                        <h5 class="card-title">{{ item.titulo }}</h5>
                        <a href="/filme/{{ id }}" class="btn btn-danger w-100">Assistir</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
