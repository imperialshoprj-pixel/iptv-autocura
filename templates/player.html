<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ filme.titulo }}</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .video-js { width: 90%; max-width: 900px; height: 500px; }
    </style>
</head>
<body>

    <h2>{{ filme.titulo }}</h2>

    <video id="meu-video" class="video-js vjs-big-play-centered" controls preload="auto">
        <source src="{{ filme.url }}" type="application/x-mpegURL"> <source src="{{ filme.url }}" type="video/mp4">             </video>

    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <script>
        var player = videojs('meu-video');
    </script>

</body>
</html>
