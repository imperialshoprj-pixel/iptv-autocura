<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ filme.titulo }} - Assistindo</title>
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        body { background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .video-container { width: 80%; max-width: 900px; }
    </style>
</head>
<body>
    <div class="video-container">
        <h2>{{ filme.titulo }}</h2>
        <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" width="100%" height="500">
            <source src="{{ filme.url }}" type="application/x-mpegURL">
            <source src="{{ filme.url }}" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <!-- Video.js JS -->
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <script>
        var player = videojs('my-video');
    </script>
</body>
</html>
