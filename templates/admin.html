<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Launcher</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#eef2f7;font-family:Arial,sans-serif}header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1d2430}main{width:min(1200px,90%);margin:28px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card,.box{background:#11151d;border:1px solid #202735;border-radius:16px;padding:18px}.card h3{margin:0 0 8px}.muted{color:#8e9aaa;font-size:13px}input,button{padding:11px;border-radius:9px;border:1px solid #2a3342;background:#0b0f16;color:#fff}input{width:100%;margin:5px 0}button{cursor:pointer;font-weight:700}.danger{background:#341217;border-color:#63222b}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.url{word-break:break-all;font-size:12px;color:#8fb4ff}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.add{margin-bottom:25px}
</style></head><body><header><strong>LAUNCHER • PAINEL</strong><form method="post" action="/admin/logout"><button>Sair</button></form></header><main>
<section class="box add"><h2>Novo aplicativo</h2><form method="post" action="/admin/apps" enctype="multipart/form-data"><div class="row"><input name="name" placeholder="Nome" required><input name="package" placeholder="Pacote Android" required></div><div class="row"><input name="version" placeholder="Versão" required><input name="recloneHours" type="number" min="0" value="160" placeholder="Reclone (horas)"></div><input name="apk" type="file" accept=".apk"><button>Adicionar app</button></form></section>
<h2>Apps ({{apps|length}})</h2><div class="grid">{% for a in apps %}<article class="card"><div class="top"><h3>{{a['name']}}</h3><span class="muted">#{{a['id']}}</span></div><div class="muted">{{a['package']}}</div><form method="post" action="/admin/apps/{{a['id']}}" enctype="multipart/form-data"><input name="name" value="{{a['name']}}" required><input name="version" value="{{a['version']}}" required><input name="recloneHours" type="number" min="0" value="{{a['reclone_hours']}}"><input name="apk" type="file" accept=".apk"><button>Salvar alterações</button></form><p class="url">{{a['url'] or 'Sem APK enviado'}}</p><form method="post" action="/admin/apps/{{a['id']}}/delete" onsubmit="return confirm('Excluir este app?')"><button class="danger">Excluir</button></form></article>{% endfor %}</div>
</main></body></html>
