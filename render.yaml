services:
  - type: web
    name: launcher-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: APP_VERSION
        value: 1.0.6
      - key: ADMIN_USER
        value: admin
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: launcher-data
      mountPath: /var/data
      sizeGB: 10
